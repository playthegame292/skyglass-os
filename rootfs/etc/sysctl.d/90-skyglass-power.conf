# Skyglass: phones get unplugged. Write changes to the SD card within ~10 s (the kernel's
# default is up to 30 s), so a power cut loses as little as possible. The writeback timer
# stays at the default 5 s: waking the card more rarely saved little and risked more.
vm.dirty_writeback_centisecs = 500
vm.dirty_expire_centisecs = 1000

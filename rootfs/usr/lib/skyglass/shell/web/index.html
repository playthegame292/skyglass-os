<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Skyglass</title>
<script>setTimeout(function () { if (!window.SKYGLASS_BOOTED) location.reload(); }, 12000);</script>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-sky">
<div id="phone">
  <!-- wallpaper -->
  <div id="wall">
    <div class="sky"></div>
    <div class="rays"></div>
    <div class="sun"></div>
    <svg class="hills" viewBox="0 0 600 300" preserveAspectRatio="none">
      <defs>
        <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6f36a"/><stop offset="1" stop-color="#2f9b2a"/></linearGradient>
        <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe05a"/><stop offset="1" stop-color="#1f7a24"/></linearGradient>
        <linearGradient id="hillShine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <path d="M0 150 C120 60 260 70 360 140 C440 190 520 120 600 110 L600 300 L0 300Z" fill="url(#hillB)"/>
      <path d="M0 210 C140 130 300 150 420 200 C500 230 560 200 600 190 L600 300 L0 300Z" fill="url(#hillA)"/>
      <path d="M0 210 C140 130 300 150 420 200 C500 230 560 200 600 190 L600 215 C560 222 500 250 420 222 C300 175 140 155 0 232Z" fill="url(#hillShine)"/>
    </svg>
    <canvas id="bubbles"></canvas>
    <canvas id="fish"></canvas>
  </div>

  <!-- status bar -->
  <div id="statusbar">
    <span id="sb-time">--:--</span>
    <span class="sb-right">
      <span id="sb-dnd" class="hidden" title="Do Not Disturb">☾</span>
      <span id="sb-notif" class="hidden"></span>
      <span id="sb-modem" class="hidden">4G</span>
      <svg id="sb-wifi" viewBox="0 0 24 24"><path class="w3" d="M2 9a15 15 0 0 1 20 0"/><path class="w2" d="M5 12.5a10.5 10.5 0 0 1 14 0"/><path class="w1" d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.4"/></svg>
      <span id="sb-batt"><span class="cell"><span class="fill"></span></span><span id="sb-batt-pct"></span></span>
    </span>
  </div>

  <!-- quick settings -->
  <div id="quick" class="glass">
    <div class="q-head"><span id="q-date"></span><span id="q-temp"></span></div>
    <div class="q-toggles">
      <button class="qt" data-q="wifi"><i data-icon="wifi"></i><span>Wi-Fi</span></button>
      <button class="qt" data-q="glass"><i data-icon="drop"></i><span>Glass</span></button>
      <button class="qt" data-q="bubbles"><i data-icon="bubble"></i><span>Bubbles</span></button>
      <button class="qt" data-q="rotate"><i data-icon="rotate"></i><span>Rotate</span></button>
      <button class="qt" data-q="torch"><i data-icon="torch"></i><span>Flashlight</span></button>
      <button class="qt" data-q="dnd"><i data-icon="moon"></i><span>Do Not Disturb</span></button>
    </div>
    <label class="q-slider"><i data-icon="sun"></i><input type="range" id="q-bright" min="10" max="100" value="100"></label>
    <label class="q-slider"><i data-icon="speaker"></i><input type="range" id="q-vol" min="0" max="100" value="60"></label>
    <div class="q-actions">
      <button class="pill" data-q="lock">Lock</button>
      <button class="pill" data-q="power">Power…</button>
    </div>
    <div id="q-notifs"></div>
    <div class="q-grip"></div>
  </div>

  <!-- home -->
  <div id="home">
    <div id="widget" class="glass">
      <div id="w-clock">--:--</div>
      <div id="w-sub"><span id="w-date"></span><span id="w-info"></span></div>
    </div>
    <div id="grid"></div>
    <div id="dock" class="glass"></div>
  </div>

  <!-- app windows go here -->
  <div id="windows"></div>

  <!-- lock screen -->
  <div id="lock">
    <div id="l-time">--:--</div>
    <div id="l-date"></div>
    <div id="l-card" class="glass"><b>Welcome to Skyglass</b><span>Your phone. Your Linux. No ads, no tracking.</span></div>
    <div id="l-notifs"></div>
    <div id="l-hint"><div class="shimmer">swipe up to unlock</div></div>
    <div id="l-pin"></div>
  </div>

  <div id="dimmer"></div>
  <div id="osk" class="hidden"></div>
  <div id="homebar"><div></div></div>
  <div id="toasts"></div>
  <div id="banners"></div>
  <div id="modal-root"></div>
</div>
<script src="/api/settings.js"></script>
<script src="app.js"></script>
</body>
</html>
